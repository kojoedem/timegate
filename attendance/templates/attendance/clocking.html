{% extends 'attendance/base.html' %}
{% load static %}

{% block title %}Login - TimeGate{% endblock %}

{% block content %}
<div class="d-flex flex-column justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-8 col-lg-6 text-center">

        <h1 id="user-greeting" class="mb-4">Please look at the camera to log in...</h1>

        <div id="camera-container" class="mb-3 d-flex justify-content-center">
            <video id="video" width="320" height="240" autoplay playsinline class="border rounded shadow-sm"></video>
            <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
        </div>

        <!-- The notification area is still useful for camera errors or other feedback -->
        <div id="notification-area" class="col-md-8 mx-auto"></div>

        <div class="mt-4">
            <p>Don't have an account? <a href="{% url 'register' %}">Register here</a>.</p>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
    <script src="{% static 'attendance/js/clocking.js' %}"></script>
{% endblock %}
