{% extends 'attendance/base.html' %}

{% block title %}Edit User: {{ target_user.username }} - TimeGate{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3>Edit User: <span class="text-primary">{{ target_user.username }}</span></h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="{% url 'profile_page' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
