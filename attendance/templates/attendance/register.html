<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { display: flex; flex-direction: column; max-width: 400px; }
        form p { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; }
        input, button { padding: 10px; margin-top: 5px; }
        button { cursor: pointer; background-color: #28a745; color: white; border: none; }
    </style>
</head>
<body>
    <h1>Register</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
</body>
</html>
